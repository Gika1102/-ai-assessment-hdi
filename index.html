<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Formulário Interativo</title>
  <link rel="stylesheet" href="../css/form.css" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <span class="eyebrow">FEIRA • DEMO</span>
      <h1>Conte um pouco sobre você</h1>
      <p>Responda rapidinho. Leva menos de 1 minuto.</p>
    </section>

    <section class="progress-wrap" aria-label="Progresso">
      <div class="progress-track"><div id="progressBar" class="progress-fill"></div></div>
      <span id="stepLabel">Etapa 1 de 3</span>
    </section>

    <form id="feedbackForm" novalidate>
      <div class="step active" data-step="1">
        <div class="step-number">01</div>
        <h2>Quem é você?</h2>
        <label>Nome <span>*</span>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Seu nome" required />
        </label>
        <label>E-mail <span>*</span>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@empresa.com" required />
        </label>
        <label>Empresa
          <input id="company" name="company" type="text" autocomplete="organization" placeholder="Sua empresa" />
        </label>
      </div>

      <div class="step" data-step="2">
        <div class="step-number">02</div>
        <h2>Sobre a experiência</h2>
        <label>Qual tema mais te interessa? <span>*</span>
          <select id="interest" name="interest" required>
            <option value="">Selecione</option>
            <option>IA e automação</option>
            <option>Dados e analytics</option>
            <option>Cloud</option>
            <option>Experiência do cliente</option>
            <option>Outro</option>
          </select>
        </label>
        <label>Quanto você já conhece sobre o assunto? <span>*</span>
          <div class="choice-grid">
            <label class="choice"><input type="radio" name="level" value="Iniciante" required /><span>Iniciante</span></label>
            <label class="choice"><input type="radio" name="level" value="Intermediário" /><span>Intermediário</span></label>
            <label class="choice"><input type="radio" name="level" value="Avançado" /><span>Avançado</span></label>
          </div>
        </label>
      </div>

      <div class="step" data-step="3">
        <div class="step-number">03</div>
        <h2>Última pergunta ✨</h2>
        <label>O que você gostaria de ver ou experimentar?
          <textarea id="comment" name="comment" rows="5" placeholder="Escreva aqui..."></textarea>
        </label>
        <div class="privacy-note">
          <strong>Pronto para enviar?</strong>
          <span>Seu envio será registrado para análise da demonstração.</span>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="backBtn" class="btn secondary" hidden>Voltar</button>
        <button type="button" id="nextBtn" class="btn primary">Continuar</button>
        <button type="submit" id="submitBtn" class="btn primary" hidden>Enviar resposta</button>
      </div>
      <p id="statusMessage" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="../js/form.js"></script>
</body>
</html>
